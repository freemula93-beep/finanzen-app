<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Meine Finanzen</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="topbar-title">Übersicht</h1>
    <div class="period-switch" id="period-switch"></div>
  </header>

  <main id="view-root" class="view-root"></main>

  <nav class="tabbar">
    <button class="tab-btn" data-view="dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"/></svg>
      <span>Übersicht</span>
    </button>
    <button class="tab-btn" data-view="transactions">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg>
      <span>Buchungen</span>
    </button>
    <button class="tab-btn tab-btn-fab" data-view="import">
      <svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 011 1v10.59l3.3-3.3a1 1 0 111.4 1.42l-5 5a1 1 0 01-1.4 0l-5-5a1 1 0 111.4-1.42l3.3 3.3V3a1 1 0 011-1zM5 20a1 1 0 011-1h12a1 1 0 110 2H6a1 1 0 01-1-1z"/></svg>
      <span>Import</span>
    </button>
    <button class="tab-btn" data-view="analysis">
      <svg viewBox="0 0 24 24"><path d="M3 3a1 1 0 011 1v15h16a1 1 0 110 2H3a1 1 0 01-1-1V4a1 1 0 011-1zm15.5 3.5a1 1 0 011.4 0 1 1 0 010 1.42l-5 5a1 1 0 01-1.4 0l-2.8-2.8-3.3 3.3A1 1 0 116 12l4-4a1 1 0 011.4 0l2.8 2.8 4.3-4.3z"/></svg>
      <span>Analyse</span>
    </button>
    <button class="tab-btn" data-view="settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm7.4-3.5c0-.6-.05-1.2-.14-1.76l1.9-1.48a.9.9 0 00.22-1.15l-1.8-3.12a.9.9 0 00-1.1-.39l-2.24.9a7.4 7.4 0 00-1.52-.88l-.34-2.38a.9.9 0 00-.89-.74h-3.6a.9.9 0 00-.89.74l-.34 2.38c-.55.23-1.06.53-1.52.88l-2.24-.9a.9.9 0 00-1.1.39L1.9 7.61a.9.9 0 00.22 1.15l1.9 1.48c-.09.56-.14 1.16-.14 1.76s.05 1.2.14 1.76l-1.9 1.48a.9.9 0 00-.22 1.15l1.8 3.12a.9.9 0 001.1.39l2.24-.9c.46.35.97.65 1.52.88l.34 2.38a.9.9 0 00.89.74h3.6a.9.9 0 00.89-.74l.34-2.38c.55-.23 1.06-.53 1.52-.88l2.24.9a.9.9 0 001.1-.39l1.8-3.12a.9.9 0 00-.22-1.15l-1.9-1.48c.09-.56.14-1.16.14-1.76z"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
